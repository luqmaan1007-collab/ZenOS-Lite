name: Build ZenOS Lite
concurrency:
  group: zenos-lite-${{ github.ref }}
  cancel-in-progress: false
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'profile/**'
      - 'scripts/**'
      - '.github/workflows/**'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build in Arch Linux container with host boot tools
        run: |
          docker run --privileged --rm -v "$PWD:/src" -w /src archlinux:latest bash -euxo pipefail -c '
            pacman -Syu --noconfirm
            pacman -S --needed --noconfirm archiso grub syslinux
            chmod +x scripts/*.sh
            scripts/build-iso.sh
            scripts/check-iso.sh out/*.iso
          '
      - name: Create USB image copy
        run: |
          ISO="$(find out -maxdepth 1 -type f -name '*.iso' -print -quit)"
          test -n "$ISO"
          cp "$ISO" out/zenos-lite-usb.img
      - uses: actions/upload-artifact@v4
        with:
          name: zenos-lite-install-media
          path: |
            out/*.iso
            out/zenos-lite-usb.img
          if-no-files-found: error
