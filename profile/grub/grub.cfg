search --no-floppy --set=root --label %ARCHISO_LABEL%

set default=0
set timeout=12

menuentry "ZenOS Lite (x86_64, UEFI)" {
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=512M systemd.mask=systemd-nsresourced.service
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}
