DEFAULT zenos
PROMPT 0
TIMEOUT 120

LABEL zenos
  MENU LABEL ZenOS Lite (x86_64, BIOS)
  LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
  INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=512M systemd.mask=systemd-nsresourced.service
